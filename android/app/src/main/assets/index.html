<script>
(()=>{'use strict';
const KEY='ascent_fitness_v1';
const $=sel=>document.querySelector(sel), esc=x=>String(x??'').replace(/[&<>"']/g,s=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[s]));

try{const raw=JSON.parse(localStorage.getItem(KEY));data=raw&&raw.version===1?{...structuredClone(BASE),...raw,profile:{...BASE.profile,...raw.profile},days:raw.days||{},shopping:raw.shopping||{}}:structuredClone(BASE)}catch{data=structuredClone(BASE)}
let selected=localDate(),renderedToday=localDate(),tab='dashboard',nutritionSub='food',runningGPS=false,persistError=false;
function day(date=selected){return data.days[date]||{meals:[],runs:[],custom:[],water:0,sleep:null,weight:null,rest:false}}
function dayWrite(date=selected){if(!data.days[date])data.days[date]={meals:[],runs:[],custom:[],water:0,sleep:null,weight:null,rest:false};const d=data.days[date];d.meals??=[];d.runs??=[];d.custom??=[];d.water??=0;return d}

let foodPlan=[
 {id:'breakfast',emoji:'🍳',name:'มื้อเช้า',time:'07:30',desc:'ไข่ 2 ฟอง + มันฝรั่งนึ่ง 200 กรัม + กล้วย 1 ลูก + KCM 1 สกูป',kcal:546,protein:44.2,carb:71,fat:14},
 {id:'lunch',emoji:'🍗',name:'มื้อกลางวัน',time:'12:30',desc:'อกไก่ดิบ 200 กรัม (นำไปปรุง) + ข้าวสุก 150 กรัม + ฟักทองนึ่ง 200 กรัม + ผัก 200 กรัม + น้ำมัน 1 ช้อนชา',kcal:620,protein:54.8,carb:72,fat:11},
 {id:'snack',emoji:'🍎',name:'อาหารว่าง',time:'16:30',desc:'แอปเปิล 1 ลูก + ถั่วไม่เค็ม 20 กรัม',kcal:215,protein:5,carb:29,fat:10.5},
 {id:'dinner',emoji:'🥔',name:'มื้อเย็น',time:'19:00',desc:'อกไก่ดิบ 200 กรัม (นำไปปรุง) + มันฝรั่งนึ่ง 250 กรัม + ฟักทองนึ่ง 200 กรัม + ผัก 200 กรัม + น้ำมัน 2 ช้อนชา',kcal:685,protein:55.7,carb:82,fat:17}
];
const SHOP=[['อกไก่ดิบ 200 กรัม','14 ห่อ · 2.8 กก.'],['ไข่ไก่','14 ฟอง'],['KCM Soy Protein','245 กรัม · 7 สกูป'],['มันฝรั่ง','ประมาณ 3.5–4 กก. ก่อนเตรียม'],['ฟักทอง','ประมาณ 3.5–4 กก. ก่อนเตรียม'],['ข้าวสาร','ประมาณ 400 กรัม'],['ผักรวม','2.8 กก.'],['กล้วย','7 ลูก'],['แอปเปิล','7 ลูก'],['ถั่วไม่เค็ม','140 กรัม'],['น้ำมันปรุงอาหาร','105 มล.']];
const WEEK=[
 {label:'เริ่มจากการเดิน',type:'walk',minutes:25,pace:'11:30–14:00',desc:'เดินเร็ว 20–25 นาที พูดเป็นประโยคได้'},
 {label:'เพิ่มความสม่ำเสมอ',type:'walk',minutes:30,pace:'10:30–13:00',desc:'เดินเร็ว 25–30 นาที ไม่เร่งจนหอบ'},
 {label:'วิ่ง 1 นาที / เดิน 3 นาที',type:'interval',minutes:24,pace:'8:30–10:30',desc:'วิ่ง 1 นาที + เดิน 3 นาที × 6 รอบ'},
 {label:'วิ่ง 1.5 นาที / เดิน 2.5 นาที',type:'interval',minutes:24,pace:'8:30–10:30',desc:'วิ่ง 1.5 นาที + เดิน 2.5 นาที × 6 รอบ'},
 {label:'วิ่ง 2 นาที / เดิน 3 นาที',type:'interval',minutes:25,pace:'8:15–10:00',desc:'วิ่ง 2 นาที + เดิน 3 นาที × 5 รอบ'},
 {label:'วิ่ง 3 นาที / เดิน 2 นาที',type:'interval',minutes:25,pace:'8:15–10:00',desc:'วิ่ง 3 นาที + เดิน 2 นาที × 5 รอบ'},
 {label:'วิ่ง 5 นาที / เดิน 2 นาที',type:'interval',minutes:28,pace:'8:00–9:45',desc:'วิ่ง 5 นาที + เดิน 2 นาที × 4 รอบ'},
 {label:'วิ่ง 8 นาที / เดิน 2 นาที',type:'interval',minutes:30,pace:'8:00–9:45',desc:'วิ่ง 8 นาที + เดิน 2 นาที × 3 รอบ'}
];
function readinessFor(date=selected){const d=day(date);return d.readiness||(d.sleep!==null&&d.sleep!==undefined&&Number(d.sleep)>0&&Number(d.sleep)<6?'tired':'normal')}
function schedule(date=selected){const w=cap(Math.floor(Math.max(0,delta(date,data.profile.startDate))/7),0,7),week=WEEK[w],dow=parseDate(date).getDay();let active=(w<2?[1,3,5,6]:[2,4,6]).includes(dow);const bonusWalk=(w>=2&&dow===3);if(bonusWalk){active=true}let desc=bonusWalk?'เดินเร็วเบา ๆ 20–30 นาที (ฟื้นตัว)':week.desc; if(w===0&&dow===6)desc='เดินเร็ว 30 นาที';let minutes=bonusWalk?25:(w===0&&dow===6?30:week.minutes);return{...week,week:w+1,active,desc:active?desc:'พักฟื้น / เดินสบาย ๆ ได้ตามความพร้อม',minutes,targetKm:pctNum(minutes/((w<2)?12.5:(w<5?11:10.5))*(readinessFor(date)==='tired'?.7:1)),pace:bonusWalk?'ตามสบาย':week.pace,kind:bonusWalk||w<2?'เดิน':'วิ่งสลับเดิน'}}
function totalDistance(d){return (d.runs||[]).reduce((a,r)=>a+(Number(r.km)||0),0)}
function totals(){let km=0, sessions=0,walk=0,runs=0,runKm=0,walkKm=0;Object.values(data.days).forEach(d=>{(d.runs||[]).forEach(r=>{const dist=Number(r.km)||0;sessions++;km+=dist;if(r.type==='run'){runs++;runKm+=dist}else{walk++;walkKm+=dist}})});return{km,sessions,walk,runs,runKm,walkKm}}

function dailyNutrition(d){const food=dayMeals(d),extra=d.custom||[];return{calories:food.reduce((a,f)=>a+f.kcal,0)+extra.reduce((a,f)=>a+(+f.kcal||0),0),protein:food.reduce((a,f)=>a+f.protein,0)+extra.reduce((a,f)=>a+(+f.protein||0),0),carb:food.reduce((a,f)=>a+f.carb,0)+extra.reduce((a,f)=>a+(+f.carb||0),0),fat:food.reduce((a,f)=>a+f.fat,0)+extra.reduce((a,f)=>a+(+f.fat||0),0)}}
function dailyStatus(date=selected){const d=day(date),meals=dayMeals(d).length,sched=schedule(date),activity=(d.runs||[]).length>0,work=sched.active?activity:!!d.rest||activity,sleep=d.sleep!==null&&d.sleep!==undefined&&d.sleep!=='';return{meals,activity,work,sleep,water:(+d.water||0)>=data.profile.waterTarget,complete:meals>=3&&work&&sleep,sched}}
function dailyXP(date,d){const st=dailyStatus(date);return st.meals*25+(st.activity?60+Math.min(20,Math.round(totalDistance(d)*5)):0)+(!st.sched.active&&d.rest?20:0)+(st.sleep?10:0)+(st.sleep&&Number(d.sleep)>=data.profile.sleepTarget?20:0)+(Math.min(data.profile.waterTarget||6,Math.max(Number(d.water)||0,Object.values(d.waterSlots||{}).filter(Boolean).length))*3+(st.water?2:0))+(st.complete?80:0)}
function score(){let xp=0;for(const [date,d] of Object.entries(data.days))xp+=dailyXP(date,d);return xp}
function lvl(xp){let level=1,remaining=xp;while(remaining>=threshold(level)&&level<999){remaining-=threshold(level);level++}return{level,remaining,needed:threshold(level),rank:['E','D','C','B','A','S'][Math.min(5,Math.floor((level-1)/5))]}}
function threshold(level){return 180+(level-1)*55}
function currentStreak(){let date=localDate(),n=0;if(!dailyStatus(date).complete)date=shift(date,-1);for(let i=0;i<999;i++){if(dailyStatus(date).complete){n++;date=shift(date,-1)}else break}return n}
function weekStart(date=selected){const d=parseDate(date),weekday=(d.getDay()+6)%7;return shift(date,-weekday)}
function weekDistance(date=selected){const start=weekStart(date);let sum=0;for(let i=0;i<7;i++)sum+=totalDistance(day(shift(start,i)));return sum}
function weekDays(date=selected){const s=weekStart(date);return Array.from({length:7},(_,i)=>shift(s,i))}
function weekText(date=selected){return `สัปดาห์ ${schedule(date).week} / 8`}
function percent(a,b){return cap(Math.round(a/Math.max(1,b)*100),0,100)}
function progress(a,b,kind=''){return `<div class="progress ${kind}"><i style="width:${percent(a,b)}%"></i></div>`}
function stats(){const all=totals(),x=score(),lv=lvl(x),d=day(),st=dailyStatus();return{all,x,lv,d,st,nu:dailyNutrition(d)}}
const navs=[['dashboard','⌂','ภาพรวม'],['quests','☑','ภารกิจ'],['pantry','▣','คลังอาหาร'],['food','◈','อาหาร'],['run','♢','วิ่ง'],['stats','▥','สถิติ'],['settings','⚙','ตั้งค่า']];
function layout(content){const st=stats(),titles={dashboard:['SYSTEM ONLINE','ภารกิจของคุณวันนี้'],quests:['QUEST BOARD','ภารกิจรายวัน'],food:['NUTRITION LOG','บันทึกอาหาร'],run:['TRAINING GATE','บันทึกการวิ่ง'],stats:['PROGRESSION','สถิติและรางวัล'],settings:['CONTROL PANEL','ตั้งค่าระบบ'],pantry:['PANTRY ENGINE','คลังอาหารและจัดมื้อ']},title=titles[tab];return `<div class="app"><aside class="sidebar"><div class="brand"><div class="brand-symbol">⌁</div><div><div class="name">ASCENT</div><div class="sub">FITNESS QUEST RPG</div></div></div><div class="sect">MAIN MENU</div>${navs.map(n=>`<button class="nav ${n[0]===tab?'active':''}" data-tab="${n[0]}"><span class="sym">${n[1]}</span><span>${n[2]}</span></button>`).join('')}<div class="sideline"></div><div class="sect">CHARACTER DATA</div><div class="side-foot"><span class="tiny">CURRENT RANK</span><strong><span class="green">${st.lv.rank}-RANK</span> · LV.${st.lv.level}</strong><p>สะสม ${fmtNum(st.x)} EXP<br>วิ่ง/เดินรวม ${fmtNum(st.all.km,1)} กม.<br>ข้อมูลเก็บบนอุปกรณ์นี้</p></div></aside><main class="content"><header class="topbar"><div><div class="eyebrow">${title[0]}</div><h1>${title[1]}</h1></div><div class="toptools"><span class="pill"><span class="dot"></span> LOCAL SAVE</span><button class="iconbtn" data-tab="settings" title="ตั้งค่า">⚙</button></div></header>${content}</main><nav class="mobile-nav">${navs.filter(n=>n[0]!=='settings').map(n=>`<button data-tab="${n[0]}" class="${n[0]===tab?'active':''}"><span class="sym">${n[1]}</span><span>${n[2]}</span></button>`).join('')}</nav></div>`}
function selectedDatePicker(){return `<input class="date-input" type="date" id="selected-date" value="${esc(selected)}" max="${localDate()}" aria-label="เลือกวันที่">`}
function weeklyCalendar(){return `<div class="seven-days">${weekDays().map(dt=>{const s=dailyStatus(dt),isToday=dt===selected,progressDone=dayMeals(day(dt)).length>0||(day(dt).runs||[]).length>0;return `<button class="daybox ${isToday?'active':''}" data-date="${dt}" title="${fmtDay(dt)}" ${dt>localDate()?'disabled':''}><div class="dow">${weekdays[parseDate(dt).getDay()]}</div><div class="num">${parseDate(dt).getDate()}</div><div class="status ${s.complete?'active':progressDone?'some':''}"></div></button>`}).join('')}</div>`}
function hero(st){let p=percent(st.lv.remaining,st.lv.needed);return `<section class="hero"><div style="position:relative;z-index:1"><span class="eyebrow">✦ PLAYER STATUS · ${st.lv.rank}-RANK</span><h2>ยินดีต้อนรับ, ${esc(data.profile.name)}</h2><p class="desc">ทุกมื้อที่ดูแลตัวเอง ทุกกิโลที่วิ่ง และทุกคืนที่พักผ่อน<br>คือ EXP ของการพัฒนาตัวคุณ</p><div class="xp-track"><div class="bar" style="width:${p}%"></div></div><div class="xptext"><span>EXP ${fmtNum(st.lv.remaining)} / ${fmtNum(st.lv.needed)}</span><span>LEVEL ${st.lv.level+1} →</span></div></div><div class="level-disc" aria-label="เลเวล ${st.lv.level}"><span class="levlabel">LEVEL</span><span class="lev">${st.lv.level}</span><span class="rank-tag">${st.lv.rank}-RANK</span></div></section>`}
function smallStats(st){return `<div class="grid mt20"><div class="statcard"><div class="label">ระยะรวมวิ่ง + เดิน</div><span class="badgeicon">🏃</span><div class="number">${fmtNum(st.all.km,1)} <span class="unit">กม.</span></div></div><div class="statcard"><div class="label">ระยะสัปดาห์นี้</div><span class="badgeicon">⟡</span><div class="number">${fmtNum(weekDistance(),1)} <span class="unit">กม.</span></div></div><div class="statcard"><div class="label">เควสสำเร็จต่อเนื่อง</div><span class="badgeicon">🔥</span><div class="number">${currentStreak()} <span class="unit">วัน</span></div></div><div class="statcard"><div class="label">น้ำหนักล่าสุด</div><span class="badgeicon">⚖</span><div class="number">${fmtNum(latestWeight(),1)} <span class="unit">กก.</span></div></div></div>`}
function latestWeight(){const entries=Object.entries(data.days).filter(([k,d])=>k<=selected&&d.weight!==null&&d.weight!==undefined&&d.weight!=='').sort((a,b)=>b[0].localeCompare(a[0]));return entries.length?Number(entries[0][1].weight):data.profile.startingWeight}
function mealQuest(id){return foodPlan.find(m=>m.id===id)}
function questRows(){
  const today=selected===localDate(),minute=new Date().getHours()*60+new Date().getMinutes(),d=day(),st=dailyStatus();
  const rows=[];
  for(const f of foodPlan){const done=d.meals?.includes(f.id),due=timeMinutes(f.time)<=minute;
    if(today&&!due&&!done)continue;
    if(today&&done)continue;
    const shortage=f.shortage?.length;
    rows.push(`<div class="quest ${done?'done':''}"><button class="tick" data-meal="${f.id}" ${shortage&&!done?'disabled':''} aria-label="บันทึก ${f.name}">✓</button><div style="flex:1;min-width:0"><div class="questname">${f.emoji} ${f.name} · ${f.time}</div><div class="questdesc">${esc(f.desc)}<br>${f.kcal} kcal · ${fmtNum(f.protein)}g โปรตีน ${shortage?`<span class="orange">· มีของไม่พอ ${esc(f.shortage.join(', '))}</span>`:''}</div></div><span class="right">+25 XP</span></div>`);
  }
  const waters=waterSlots();for(const w of waters){if(today&&timeMinutes(w.time)>minute)continue;if(today&&d.waterSlots?.[w.key])continue;rows.push(`<div class="quest"><button class="tick" data-water-slot="${w.key}" aria-label="ดื่มน้ำ">✓</button><div style="flex:1"><div class="questname">💧 ดื่มน้ำ ${w.ml} มล. · ${w.time}</div><div class="questdesc">${(d.water||0)} / ${data.profile.waterTarget} แก้ว · เลื่อนตามความกระหายได้</div></div><span class="right">+ เมื่อครบเป้า</span></div>`)}
  if(st.sched.active&&(!today||minute>=timeMinutes(data.profile.exerciseTime||'18:00'))&&!st.activity)rows.push(`<div class="quest"><span class="tick">•</span><div style="flex:1"><div class="questname">🏃 ภารกิจออกกำลัง · ${esc(data.profile.exerciseTime||'18:00')}</div><div class="questdesc">${esc(st.sched.desc)} · ประมาณ ${fmtNum(st.sched.targetKm,1)} กม. · ${st.sched.minutes} นาที (ปรับตามสภาพจริง)</div></div><button class="primary" data-tab="run">เริ่มฝึก</button></div>`);
  if(!st.sched.active&&!st.work&&!today)rows.push(`<div class="quest"><div class="questname">🌙 วันพัก ฟื้นฟูร่างกาย</div><button class="ghostbutton right" data-action="rest">ยืนยันวันพัก</button></div>`);
  if(!st.sleep&&(!today||minute>=timeMinutes('07:05'))){rows.push(`<div class="quest"><span class="tick">•</span><div style="flex:1"><div class="questname">😴 บันทึกเวลานอนเมื่อคืน</div><div class="questdesc">เป้าหมาย ${data.profile.sleepTarget} ชม. · เตรียมเข้านอน ${esc(data.profile.bedtime)}</div></div><button class="ghostbutton" data-tab="dashboard">บันทึก</button></div>`)}
  const visible=rows.slice(0,4);return visible.length?visible.join('')+(rows.length>4?`<p class="hint">ยังมี ${rows.length-4} ภารกิจที่ถึงเวลาแล้ว · เปิดหน้าภารกิจเพื่อดูเพิ่มเติม</p>`:''):'<div class="empty">✦ ตอนนี้ไม่มีเควสที่ต้องทำ รอเวลาภารกิจถัดไปได้เลย</div>';
}
function dashboard(){const st=stats(),status=st.st,done=foodPlan.filter(f=>st.d.meals?.includes(f.id)).length;return `${hero(st)}${smallStats(st)}<div class="section-title"><h3>FOOD & FAT-LOSS OUTLOOK</h3><button class="ghostbutton" data-tab="pantry">จัดคลัง →</button></div><div class="panel">${forecastPanel(weeklyForecast())}</div><div class="section-title"><h3>QUEST BOARD <span class="green">// DAILY</span></h3>${selectedDatePicker()}</div><div class="grid"><div class="two panel"><div class="p-title"><h3>${fmtDay(selected)}</h3><span class="chip ${status.complete?'green':''}">${status.complete?'QUEST CLEAR +80 XP':`${done}/4 มื้อ`}</span></div>${questRows()}<div class="row between mt16"><span class="subtle">ภารกิจหลัก: บันทึกอาหารอย่างน้อย 3 มื้อ + กิจกรรมตามวัน + การนอน</span><button class="ghostbutton" data-tab="dashboard">รายละเอียด →</button></div></div><div class="four stack"><section class="panel"><div class="p-title"><h3>สัปดาห์การฝึก</h3><span class="chip">${weekText()}</span></div><div class="weekheader">${esc(status.sched.label)}</div><p class="subtle">วันนี้: ${esc(status.sched.desc)}<br>เป้าระยะประมาณ ${fmtNum(status.sched.targetKm,1)} กม.</p><p class="subtle">เพซอ้างอิงช่วงวิ่ง: ${status.sched.pace} นาที/กม.</p><button data-tab="run" class="ghostbutton full">ดูโปรแกรมวิ่ง →</button></section><section class="panel"><div class="p-title"><h3>โภชนาการวันนี้</h3><span class="subtle">${fmtNum(st.nu.calories)} / ${fmtNum(data.profile.calorieTarget)} kcal</span></div>${progress(st.nu.calories,data.profile.calorieTarget)}<div class="row between mt16"><span class="subtle">โปรตีน</span><b>${fmtNum(st.nu.protein,1)} / ${data.profile.proteinTarget} g</b></div>${progress(st.nu.protein,data.profile.proteinTarget,'lime')}<button class="ghostbutton full mt16" data-tab="food">บันทึกอาหาร →</button></section></div></div><div class="section-title"><h3>7-DAY CHRONICLE</h3><span class="help">แตะวันที่เพื่อดูย้อนหลัง</span></div><div class="panel">${weeklyCalendar()}</div>`}
function quests(){const st=stats(),s=st.st,d=st.d;return `<div class="section-title" style="margin-top:0"><h3>ภารกิจที่ถึงเวลาแล้ว</h3>${selectedDatePicker()}</div><div class="grid"><div class="two panel"><div class="row between mb8"><span class="eyebrow">QUEST PROGRESS</span><span class="chip ${s.complete?'green':''}">${s.complete?'COMPLETE':'ACTIVE'}</span></div><div class="numberline">${s.meals}<span class="dim" style="font-size:17px"> / 4 มื้อ</span></div>${progress(s.meals,4,'lime')}<p class="subtle">ภารกิจทยอยขึ้นตามเวลาที่ตั้งไว้ (เวลาดูย้อนหลังจะแสดงทั้งหมด) · รางวัลบันทึกมื้อ +25 EXP / มื้อ · เควสประจำวันที่ครบเงื่อนไขรับโบนัส +80 EXP</p>${questRows()}</div><div class="four stack"><div class="panel"><h3 style="font-size:14px">💧 น้ำดื่ม</h3><div class="numberline">${d.water||0} <span class="dim" style="font-size:13px">/ ${data.profile.waterTarget} แก้ว</span></div>${progress(d.water||0,data.profile.waterTarget)}<p class="hint">ตาราง: ${waterSlots().map(w=>w.time).join(' · ')} · 1 แก้วประมาณ ${Math.round((data.profile.waterMl||2100)/data.profile.waterTarget)} มล.</p><div class="controls mt16"><button class="ghostbutton" data-action="water-minus">− 1</button><button class="primary" data-action="water-plus">+ 1 แก้ว</button></div><p class="hint">ติ๊กในหน้าภารกิจตามเวลาได้ด้วย · ปรับตามความกระหาย อากาศ และเหงื่อ ไม่ต้องฝืนดื่มเกินจำเป็น</p></div><div class="panel"><h3 style="font-size:14px">😴 การนอน</h3><p class="hint">เป้าหมายอย่างน้อย ${data.profile.sleepTarget} ชั่วโมง · เข้านอน ${esc(data.profile.bedtime)} น.</p><form id="sleep-form" class="stack"><div class="field"><label for="sleep-hours">เมื่อคืนคุณนอนกี่ชั่วโมง?</label><input type="number" id="sleep-hours" name="hours" min="0" max="24" step="0.25" required placeholder="เช่น 6.5" value="${d.sleep===null||d.sleep===undefined?'':esc(d.sleep)}"></div><button type="submit" class="ghostbutton">บันทึกการนอน +EXP</button></form>${s.sleep?`<p class="hint green">บันทึกแล้ว ${d.sleep} ชม. ${Number(d.sleep)>=data.profile.sleepTarget?'· ถึงเป้าหมาย!':'· ค่อย ๆ เพิ่มเวลานอนนะ'}</p>`:''}</div><div class="panel"><h3 style="font-size:14px">⚖ บันทึกน้ำหนัก</h3><form id="weight-form" class="stack"><div class="field"><label>น้ำหนักเช้านี้ (กก.)</label><input type="number" required name="weight" min="25" max="300" step="0.1" value="${d.weight??''}" placeholder="เช่น 94.5"></div><button class="ghostbutton" type="submit">บันทึกน้ำหนัก</button></form><p class="hint">ชั่งหลังเข้าห้องน้ำ ก่อนกินอาหาร ดูแนวโน้มเฉลี่ย ไม่ต้องกังวลตัวเลขวันเดียว</p></div></div></div><div class="section-title"><h3>ประวัติสัปดาห์นี้</h3></div><div class="panel">${weeklyCalendar()}</div>`}
function food(){const st=stats(),d=st.d,n=st.nu;return `<div class="row wrap between legacy-food-tabs" style="margin-bottom:18px"><div class="row wrap"><button class="${nutritionSub==='food'?'primary':'ghostbutton'}" data-action="food-sub" data-value="food">บันทึกอาหาร</button><button class="${nutritionSub==='shop'?'primary':'ghostbutton'}" data-action="food-sub" data-value="shop">รายการซื้อตุน</button></div>${selectedDatePicker()}</div>${nutritionSub==='shop'?shopping():`<div class="grid"><div class="two"><div class="panel"><div class="p-title"><h3>FOOD LOG</h3><span class="chip">ชั่งอกไก่ตอนดิบ</span></div><p class="subtle">แผนจัดใหม่จากวัตถุดิบที่มีจริงในคลัง · <a href="#pantry" data-tab="pantry">แก้ไขคลังอาหาร</a> · ติ๊กเฉพาะมื้อที่กินจริงตามรายการ หากกินต่างจากแผน ให้ใช้ช่องเพิ่มอาหารเองเพื่อบันทึกปริมาณที่กินจริง</p>${foodPlan.map(f=>`<div class="foodcard ${d.meals?.includes(f.id)?'checked':''}"><span class="food-emoji">${f.emoji}</span><div class="foodcontent"><div class="foodhead"><b>${f.name} · ${f.time}</b><button data-meal="${f.id}" ${f.shortage?.length&&!d.meals?.includes(f.id)?'disabled':''} class="foodbtn">${d.meals?.includes(f.id)?'✓ กินแล้ว':'+ บันทึก'}</button></div><p>${esc(f.desc)}</p><div class="foodmeta"><span class="chip">${f.kcal} kcal</span><span class="chip green">${fmtNum(f.protein,0)}g โปรตีน</span></div></div></div>`).join('')}</div><div class="panel mt16"><div class="p-title"><h3>อาหารอื่นที่กินจริง</h3><span class="subtle">เพิ่มได้ไม่จำกัด</span></div><form id="custom-food-form" class="form-grid"><div class="field fullspan"><label>ชื่ออาหาร</label><input name="name" placeholder="เช่น นมจืด 1 กล่อง" maxlength="75" required></div><div class="field"><label>พลังงาน (kcal)</label><input name="kcal" type="number" min="0" max="3000" step="1" required></div><div class="field"><label>โปรตีน (กรัม)</label><input name="protein" type="number" min="0" max="250" step="0.1" value="0" required></div><div class="field"><label>คาร์บ (กรัม) ไม่บังคับ</label><input name="carb" type="number" min="0" max="600" step="0.1" placeholder="0"></div><div class="field"><label>ไขมัน (กรัม) ไม่บังคับ</label><input name="fat" type="number" min="0" max="300" step="0.1" placeholder="0"></div><div class="field fullspan"><button type="submit" class="primary full">+ บันทึกอาหารเพิ่มเติม</button></div></form>${(d.custom||[]).length?`<div class="muteline"></div>${d.custom.map(f=>`<div class="record"><div class="recordicon">🍽</div><div class="recordmain"><b>${esc(f.name)}</b><small>${fmtNum(f.kcal)} kcal · โปรตีน ${fmtNum(f.protein,1)} g</small></div><button class="mini-btn" data-remove-food="${esc(f.id)}" title="ลบรายการ">✕</button></div>`).join('')}`:`<p class="hint">ยังไม่มีรายการอาหารเพิ่มเติม</p>`}</div></div><div class="four stack"><div class="panel"><div class="p-title"><h3>พลังงานที่บันทึก</h3><span class="chip">DAILY</span></div><div class="ring" style="--pct:${percent(n.calories,data.profile.calorieTarget)}%"><div class="ringinner"><b>${percent(n.calories,data.profile.calorieTarget)}%</b><small>CALORIES</small></div></div><div class="row between mt16"><span class="subtle">กินแล้ว</span><b>${fmtNum(n.calories)} kcal</b></div><div class="row between mb8"><span class="subtle">เป้าหมาย</span><b>${fmtNum(data.profile.calorieTarget)} kcal</b></div><p class="hint">ตัวเลขเป็นค่าประมาณตามแผนและข้อมูลที่กรอก ไม่ใช่ผลตรวจโภชนาการจริง</p></div><div class="panel"><div class="row between mb8"><b>โปรตีน</b><span class="green">${fmtNum(n.protein,1)} / ${data.profile.proteinTarget} g</span></div>${progress(n.protein,data.profile.proteinTarget,'lime')}<div class="row between mt16"><span class="subtle">คาร์โบไฮเดรต</span><b>${fmtNum(n.carb,1)} g</b></div><div class="row between mt16"><span class="subtle">ไขมัน</span><b>${fmtNum(n.fat,1)} g</b></div></div><div class="warn"><b>หมายเหตุวัตถุดิบ</b><br>ไก่ 200 กรัมต่อมื้อเป็นน้ำหนักดิบก่อนทำให้สุก ส่วนมันฝรั่ง ฟักทองและข้าวเป็นน้ำหนักหลังนึ่ง/หุง · KCM ประมาณ 125 kcal และ 27g โปรตีนต่อ 35g โปรดเช็กฉลากผลิตภัณฑ์จริง</div></div></div>`}`}
function shopping(){const wk=weekStart(selected);const checked=data.shopping[wk]||{};return `<div class="grid"><div class="two panel"><div class="p-title"><h3>ตะกร้าซื้อของ 7 วัน</h3><span class="chip">${Object.values(checked).filter(Boolean).length}/${SHOP.length} รายการ</span></div><p class="subtle">อกไก่ดิบ 400 กรัมต่อวัน (2 ห่อ × 200 กรัม) + ไข่ 2 ฟอง + KCM 1 สกูป และคาร์บจากมันฝรั่งกับฟักทอง</p>${SHOP.map((s,i)=>`<div class="shoppingrow"><label><input data-shop="${i}" type="checkbox" ${checked[i]?'checked':''}><span style="${checked[i]?'text-decoration:line-through;color:#76928f':''}">${s[0]}</span></label><span class="qty">${s[1]}</span></div>`).join('')}<div class="controls mt16"><button class="ghostbutton" data-action="shopping-copy">คัดลอกรายการ</button><button class="ghostbutton" data-action="shopping-reset">ล้างติ๊กสัปดาห์นี้</button></div></div><div class="four stack"><div class="panel"><h3 style="font-size:14px">❄️ วิธีตุนอย่างปลอดภัย</h3><p class="subtle">เก็บอกไก่ดิบที่จะใช้ใน 1–2 วันในตู้เย็นไม่เกิน 4°C ที่เหลือแบ่งแพ็กแล้วแช่แข็ง -18°C</p><p class="subtle">ปรุงสุกแล้วเก็บในตู้เย็นไม่เกิน 3–4 วัน ถ้าจะเก็บนานกว่านั้นให้แช่แข็ง</p><p class="subtle">ละลายในตู้เย็น ไม่วางทิ้งที่อุณหภูมิห้อง และปรุงไก่ให้ถึง 74°C</p></div><div class="warn">ตารางนี้เน้นกินซ้ำเพื่อความสะดวก คุณสามารถสลับปลา เต้าหู้ และผักหลายสีเพื่อให้สารอาหารหลากหลาย</div></div></div>`}
function pace(km,min){if(!(km>0&&min>0))return '—';const sec=Math.round(min*60/km);return `${Math.floor(sec/60)}:${String(sec%60).padStart(2,'0')}`}
function run(){const s=schedule(),d=day(),records=(d.runs||[]),all=totals();return `<div class="run-banner"><div class="row between wrap"><span class="eyebrow">TRAINING ARC · ${weekText()}</span>${selectedDatePicker()}</div><h2 style="font-size:23px;margin:13px 0 8px">${s.active?esc(s.label):'RECOVERY DAY'}</h2><strong>${esc(s.desc)}</strong><p>ประเภท: ${s.active?esc(s.kind):'พัก'} ${s.active?'· ระยะประมาณ '+fmtNum(s.targetKm,1)+' กม. · เวลาช่วงหลัก '+s.minutes+' นาที':''}<br>เพซอ้างอิงเฉพาะช่วงวิ่ง: ${s.pace} นาที/กม. <span style="color:#8ec3c6">(ไม่ใช่เป้าหมายที่ต้องฝืน)</span></p><span class="goaltag">${s.active?'✓ พูดเป็นประโยคได้ระหว่างออกกำลังกาย':'✓ วันพักไม่ทำให้เลเวลลด'}</span></div><div class="grid"><div class="six panel"><div class="p-title"><h3>บันทึกกิจกรรม</h3><span class="chip">MANUAL LOG</span></div><form id="run-form" class="form-grid"><div class="field fullspan"><label>ประเภทกิจกรรม</label><select name="type"><option value="walk" ${s.kind==='เดิน'?'selected':''}>เดิน / เดินเร็ว</option><option value="run" ${s.kind==='วิ่งสลับเดิน'?'selected':''}>วิ่ง / วิ่งสลับเดิน</option></select></div><div class="field"><label>ระยะทาง (กม.)</label><input type="number" name="km" id="run-km" min="0" max="200" step="0.01" placeholder="เช่น 2.50" required></div><div class="field"><label>เวลาที่ใช้ (นาที)</label><input type="number" name="minutes" id="run-min" min="1" max="1440" step="0.1" placeholder="เช่น 25" required></div><div class="field fullspan"><label>ความรู้สึกหลังวิ่ง</label><select name="effort"><option value="easy">สบาย ๆ · คุยได้</option><option value="moderate">เหนื่อยปานกลาง</option><option value="hard">หนักกว่าที่ตั้งใจ</option></select></div><div class="field fullspan"><button class="primary full" type="submit">⚡ บันทึกกิจกรรม +EXP</button></div></form><p class="hint">นับระยะจริงจากนาฬิกา แอปวิ่ง หรือการวัดทาง รวมระยะเดินด้วย โปรแกรมไม่บังคับให้วิ่งหนักเพื่อรับ EXP</p></div><div class="six panel"><div class="p-title"><h3>GPS TRACKER <span class="chip">ทดลองใช้</span></h3></div><p class="hint">หากเปิดผ่าน HTTPS / localhost และอนุญาตตำแหน่ง สามารถลองบันทึกระยะทางด้วย GPS ได้ ต้องเปิดหน้าจอนี้ไว้ (มือถืออาจหยุดติดตามเมื่อปิดจอ) ตรวจความแม่นยำก่อนบันทึกเสมอ</p><div id="gps-ui">${gpsUI()}</div></div><div class="six panel"><div class="p-title"><h3>สรุปวันนี้</h3><span class="chip">${records.length} กิจกรรม</span></div><div class="row between mb8"><span class="subtle">ระยะที่บันทึก</span><span class="numberline">${fmtNum(totalDistance(d),2)} <span style="font-size:13px" class="dim">กม.</span></span></div><div class="muteline"></div>${records.length?records.map(r=>`<div class="record"><span class="recordicon">${r.type==='run'?'🏃':'🚶'}</span><div class="recordmain"><b>${r.type==='run'?'วิ่ง / สลับเดิน':'เดิน / เดินเร็ว'}</b><small>${fmtNum(r.minutes,1)} นาที · เพซ ${pace(r.km,r.minutes)} นาที/กม. · ${r.effort==='hard'?'เหนื่อยมาก':r.effort==='moderate'?'ปานกลาง':'สบาย'}</small></div><div class="val">${fmtNum(r.km,2)}</div><button class="mini-btn" data-remove-run="${esc(r.id)}" aria-label="ลบกิจกรรม">✕</button></div>`).join(''):`<div class="empty">ยังไม่ได้บันทึกกิจกรรมในวันนี้</div>`}</div><div class="six panel"><div class="p-title"><h3>TRAINING RECORD</h3></div><div class="row between"><span class="subtle">ระยะวิ่งสะสม</span><b class="accent">${fmtNum(all.runKm,2)} กม.</b></div><div class="row between mt16"><span class="subtle">ระยะเดินสะสม</span><b>${fmtNum(all.walkKm,2)} กม.</b></div><div class="row between mt16"><span class="subtle">ระยะรวมวิ่ง + เดิน</span><b>${fmtNum(all.km,2)} กม.</b></div><div class="row between mt16"><span class="subtle">จำนวนกิจกรรม</span><b>${all.sessions} ครั้ง</b></div><div class="row between mt16"><span class="subtle">ระยะสัปดาห์นี้</span><b>${fmtNum(weekDistance(),2)} กม.</b></div><div class="muteline"></div><p class="subtle">ตารางเริ่มต้นค่อย ๆ เพิ่มเวลาวิ่งจากการเดินเพื่อช่วยลดความเสี่ยงบาดเจ็บ หากปวดเข่าหรือข้อเท้าให้ลดความหนักหรือพัก</p></div></div>`}
let gps={watch:null,elapsed:0,started:0,km:0,last:null,active:false,points:0,error:'',runType:'run'};
function nativeGPSReadIfPresent(){if(window.AscentNative?.getRunState)nativeGPSRead()}
function nativeGPSRead(){try{const n=JSON.parse(window.AscentNative.getRunState());if(n&&Number.isFinite(Number(n.km))){gps.km=Number(n.km);gps.points=Number(n.points)||0;gps.elapsed=Number(n.elapsed)||0;gps.active=!!n.active;gps.started=Date.now();}}catch(e){console.warn('GPS bridge',e)}}
function gpsUI(){return `<div class="timer" id="gps-clock">${clockGPS()}</div><div class="timermetrics"><div><b id="gps-km">${fmtNum(gps.km,2)}</b><small>กิโลเมตร</small></div><div><b id="gps-pace">${gps.km>.01?pace(gps.km,(gps.elapsed+((gps.active?Date.now()-gps.started:0)))/60000):'—'}</b><small>นาที / กม.</small></div><div><b>${gps.points}</b><small>GPS POINTS</small></div></div><div class="controls" id="gps-controls">${gps.active?`<button class="ghostbutton" data-action="gps-pause">⏸ หยุดชั่วคราว</button><button class="primary" data-action="gps-finish">จบและตรวจข้อมูล</button>`:gps.elapsed>0?`<button class="ghostbutton" data-action="gps-resume">▶ ต่อ</button><button class="primary" data-action="gps-finish">จบและตรวจข้อมูล</button>`:`<button class="primary full" data-action="gps-start">◎ เริ่มจับ GPS</button>`}</div>${gps.error?`<p class="hint orange">${esc(gps.error)}</p>`:''}`}
function clockGPS(){let secs=Math.floor((gps.elapsed+(gps.active?Date.now()-gps.started:0))/1000);return `${String(Math.floor(secs/3600)).padStart(2,'0')}:${String(Math.floor(secs%3600/60)).padStart(2,'0')}:${String(secs%60).padStart(2,'0')}`}
function distanceM(a,b){const R=6371000,rad=v=>v*Math.PI/180,p1=rad(a.latitude),p2=rad(b.latitude),dp=rad(b.latitude-a.latitude),dl=rad(b.longitude-a.longitude),c=Math.sin(dp/2)**2+Math.cos(p1)*Math.cos(p2)*Math.sin(dl/2)**2;return 2*R*Math.atan2(Math.sqrt(c),Math.sqrt(1-c))}
function gpsBegin(){if(window.AscentNative?.startRun){if(!gps.active)window.AscentNative.startRun();gps.active=true;gps.started=Date.now();gpsUpdate();return}if(!window.isSecureContext||!navigator.geolocation){toast('GPS ต้องใช้ HTTPS หรือ localhost และเบราว์เซอร์ที่รองรับ');return}if(gps.active)return;gps.active=true;gps.started=Date.now();gps.last=null;gps.error='';gps.watch=navigator.geolocation.watchPosition(pos=>{if(!gps.active)return;const c=pos.coords;if(c.accuracy>40)return;const sample={latitude:c.latitude,longitude:c.longitude,t:pos.timestamp};if(gps.last){const meters=distanceM(gps.last,sample),seconds=Math.max(1,(sample.t-gps.last.t)/1000);if(meters>=5 && meters<=100 && meters/seconds<=5.5){gps.km+=meters/1000;gps.points++;gps.last=sample}else if(meters<=5){/* ignore jitter */}else{gps.last=sample}}else{gps.last=sample;gps.points++}gpsUpdate()},err=>{gps.error='ตำแหน่ง GPS มีปัญหา: '+err.message;gpsPause();toast('GPS ไม่พร้อม ลองกรอกระยะเองได้')},{enableHighAccuracy:true,maximumAge:0,timeout:15000});gpsUpdate()}
function gpsPause(){if(window.AscentNative?.pauseRun){nativeGPSRead();window.AscentNative.pauseRun()}if(!gps.active)return;gps.elapsed+=Date.now()-gps.started;gps.active=false;gps.last=null;if(gps.watch!==null){navigator.geolocation.clearWatch(gps.watch);gps.watch=null}gpsUpdate()}
function gpsFinish(){if(window.AscentNative?.finishRun){nativeGPSRead();window.AscentNative.finishRun();gps.active=false;gps.started=0}else gpsPause();const min=Math.round(gps.elapsed/6000)/10,km=Math.round(gps.km*100)/100;if(min<=0){gpsReset();return}const dist=$('#run-km'),dur=$('#run-min');if(dist)dist.value=km;if(dur)dur.value=min;gpsReset();toast('เติมระยะ/เวลาให้แล้ว ตรวจ GPS ก่อนกดบันทึกกิจกรรม');document.getElementById('run-form')?.scrollIntoView({behavior:'smooth',block:'center'})}
function gpsReset(){gps={watch:null,elapsed:0,started:0,km:0,last:null,active:false,points:0,error:'',runType:'run'};gpsUpdate()}
function gpsUpdate(){if(window.AscentNative?.getRunState)nativeGPSRead();const ui=$('#gps-ui');if(ui)ui.innerHTML=gpsUI()}
setInterval(()=>{if(gps.active||window.AscentNative?.getRunState)gpsUpdate()},1000);
function statsView(){const st=stats(),last7=weekDays(),max=Math.max(2,...last7.map(d=>totalDistance(day(d))));const awards=[['🥇','เปิดระบบ','บันทึกอาหารหรือกิจกรรมอย่างน้อย 1 รายการ',st.x>0],['🏃','กิโลเมตรแรก','ระยะสะสมครบ 1 กม.',st.all.km>=1],['⚡','นักวิ่ง 10 กม.','ระยะสะสมครบ 10 กม.',st.all.km>=10],['🌌','นักวิ่ง 50 กม.','ระยะสะสมครบ 50 กม.',st.all.km>=50],['🔥','QUICK QUEST','เควสสำเร็จต่อเนื่อง 3 วัน',currentStreak()>=3],['👑','LEVEL FIVE','เลเวลถึง 5',st.lv.level>=5]];const wts=Object.entries(data.days).filter(([k,d])=>k<=selected&&d.weight!=null&&d.weight!=='').sort((a,b)=>a[0].localeCompare(b[0])).slice(-15);return `<div class="grid">${smallStats(st).replace('class="grid mt20"','class="grid twelve"')}<div class="six panel"><div class="p-title"><h3>ระยะทาง 7 วัน</h3><span class="chip">${fmtNum(weekDistance(),2)} กม.</span></div><div class="weekbars">${last7.map(date=>{const km=totalDistance(day(date));return `<div class="barcol"><span class="barcap">${km?fmtNum(km,1):''}</span><div class="barfill" style="height:${Math.max(3,km/max*105)}px"></div><small>${weekdays[parseDate(date).getDay()]}</small></div>`}).join('')}</div><p class="hint">รวมระยะของทั้งการเดินและวิ่งจากรายการที่คุณบันทึก</p></div><div class="six panel"><div class="p-title"><h3>น้ำหนักเทียบเป้าหมาย</h3><span class="chip">${data.profile.goalWeight} กก.</span></div><div class="row between"><span class="subtle">เริ่มต้น ${data.profile.startingWeight} กก.</span><span class="green">ล่าสุด ${fmtNum(latestWeight(),1)} กก.</span></div>${weightChart(wts)}<p class="hint">แนวโน้มจากวันที่คุณบันทึก ไม่ใช้ตัวเลขขึ้นลงวันเดียวมาตัดสินผล</p><button class="ghostbutton full" data-tab="dashboard">บันทึกน้ำหนัก →</button></div><div class="six panel"><div class="p-title"><h3>ACHIEVEMENTS</h3><span class="chip">${awards.filter(a=>a[3]).length}/${awards.length} ปลดล็อก</span></div>${awards.map(a=>`<div class="trophy ${a[3]?'':'locked'}"><span class="em">${a[0]}</span><div><b>${a[1]}</b><p>${a[2]}</p></div><span class="ri // Protein substitutes aim for protein, carbs/fats aim for energy; never invent inventory.
craftMeal=function(recipe,store){
 const used={},shortage=[];
 for(const [key,required] of Object.entries(recipe.items)){
   let take=Math.min(required,Math.max(0,store[key]||0));if(WHOLE_UNITS.has(key))take=Math.floor(take);
   if(take>0){used[key]=(used[key]||0)+take;store[key]=pctNum(Math.max(0,store[key]-take));}
   let missing=required-take;if(missing<=.001)continue;
   const isProtein=PROTEINS.has(key),needed=missing*(isProtein?ING[key].p:ING[key].kcal);
   let unmet=needed;
   for(const other of FOOD_SUBS[key]||subMap[key]||[]){
     const ingredient=ING[other];if(!ingredient)continue;
     const unitValue=isProtein?ingredient.p:ingredient.kcal;if(unitValue<=0)continue;
     const room=Math.max(0,(MAX_PER_MEAL[other]||1e6)-(used[other]||0));
     let take2=Math.min(Math.max(0,store[other]||0),room,unmet/unitValue);
     if(WHOLE_UNITS.has(other))take2=Math.floor(take2);
     else take2=Math.floor(take2);
     if(take2<=0)continue;
     used[other]=(used[other]||0)+take2;store[other]=pctNum(Math.max(0,store[other]-take2));
     unmet=Math.max(0,unmet-take2*unitValue);if(unmet<needed*.12)break;
   }
   if(unmet>Math.max(isProtein?3:30,needed*.23))shortage.push(ING[key].name);
 }
 const v=foodValue(used);return{id:recipe.id,name:recipe.name,time:recipe.time,emoji:recipe.emoji,items:used,desc:quantities(used)||'ไม่มีอาหารในคลัง',shortage,kcal:Math.round(v.kcal),protein:pctNum(v.protein),carb:pctNum(v.carb),fat:pctNum(v.fat)};
};

function trainingDays(date){

  const dt=shift(monday,i),w=runningWindow(dt,legacySchedule(dt).minutes);

 const all=1<<candidates.length;
 for(let mask=0;mask<all;mask++){
  const choice=candidates.filter((x,i)=>mask&(1<<i));if(choice.length>wanted)continue;
  if(sample.week>2&&choice.some((x,i)=>i&&x.index-choice[i-1].index<2))continue;
  const total=choice.reduce((s,x)=>s+x.score,0)+choice.length*100;

}

function parseReceiptText(txt){
 const arr=[];for(const raw of String(txt).split(/\r?\n/)){const clean=raw.trim();if(clean.length<2)continue;
  const low=clean.toLowerCase();const match=RECEIPT_KEYS.find(([k,terms])=>terms.some(t=>low.includes(t.toLowerCase())));if(!match)continue;
  const key=match[0];let amount=RECEIPT_DEFAULT[key]||1,uncertain=true;
  const size=low.match(/(\d{2,4})\s*(กรัม|ก\.|g\b|ml\b|มล\.?|ซีซี)/i);
  if(size){amount=Number(size[1]);uncertain=false;}
  const pcs=low.match(/(?:จำนวน|qty|x|×)\s*(\d{1,2})\b/i) || low.match(/(\d{1,2})\s*(?:ห่อ|แพ็ก|กล่อง|ถุง|ชิ้น|ฟอง)/i);
  if(pcs&&Number(pcs[1])<30){amount*=Number(pcs[1]);if(!size)uncertain=true;}
  if(WHOLE_UNITS.has(key)&&!size){amount=key==='soy'?Math.max(1,Math.round(amount)):Math.max(1,Math.round(amount));}
  arr.push({id:arr.length,key,amount,uncertain,raw:clean,checked:true});
 }
 return arr;
}

 const s=document.createElement('script');s.dataset.ocrLib='yes';s.src='https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js';s.onload=()=>resolve(window.Tesseract);s.onerror=()=>reject(Error('โหลด OCR ไม่สำเร็จ: ตรวจอินเทอร์เน็ต'));document.head.appendChild(s);

async function scanReceipt(file){
 if(!/^image\/(jpeg|png|webp)$/.test(file.type)||file.size>8e6){toast('ต้องเป็นภาพ JPG/PNG/WEBP ขนาดไม่เกิน 8 MB');return}
 receiptState='กำลังโหลดตัวอ่านภาษาไทยและอังกฤษ...';render();
 let worker=null;
 try{const t=await loadOCRLibrary();receiptState='กำลังอ่านข้อความจากรูป...';const s=$('#receipt-state');if(s)s.textContent=receiptState;
  worker=await t.createWorker(['tha','eng']);const out=await worker.recognize(file);receiptRaw=out.data.text||'';
  receiptDraft=parseReceiptText(receiptRaw);receiptState='อ่านเสร็จ · พบ '+receiptDraft.length+' รายการที่รู้จัก โปรดตรวจทาน';
  if(!receiptDraft.length)toast('ไม่พบสินค้าในฐานข้อมูล กรุณาตรวจข้อความ OCR หรือเพิ่มรายการเอง');
 }catch(err){receiptState='สแกนไม่สำเร็จ: '+err.message+' · คุณยังวางข้อความใบเสร็จเพื่อจับคู่เองได้';toast(receiptState)}
 finally{if(worker)await worker.terminate().catch(()=>{});render()}
}

let fxCanvas=null,fxCtx=null,fxParticles=[],fxFrame=null,fxLast=0,fxBurstParticles=[];
const reducedMotion=window.matchMedia?.('(prefers-reduced-motion: reduce)');
function fxEnabled(){return !!data.profile.fxEnabled&&!reducedMotion?.matches&&!document.hidden}
function fxInit(){
 if(!fxCanvas){fxCanvas=document.createElement('canvas');fxCanvas.id='rpg-canvas';fxCanvas.setAttribute('aria-hidden','true');document.body.appendChild(fxCanvas);fxCtx=fxCanvas.getContext('2d',{alpha:true});}
 if(!fxCtx)return;fxCanvas.style.display=data.profile.fxEnabled?'block':'none';
 const w=window.innerWidth,h=window.innerHeight,dpr=Math.min(2,devicePixelRatio||1);
 fxCanvas.width=Math.round(w*dpr);fxCanvas.height=Math.round(h*dpr);fxCanvas.style.width=w+'px';fxCanvas.style.height=h+'px';fxCtx.setTransform(dpr,0,0,dpr,0,0);
 fxParticles=Array.from({length:Math.min(32,Math.floor(w*h/35000))},()=>({x:Math.random()*w,y:Math.random()*h,v:.08+Math.random()*.17,size:.6+Math.random()*1.3}));
 if(fxEnabled()&&!fxFrame)fxFrame=requestAnimationFrame(fxDraw);
}
function fxDraw(t){fxFrame=null;if(!fxEnabled()||!fxCtx)return;const dt=Math.min(40,Math.max(1,t-fxLast||16));fxLast=t;
 const w=window.innerWidth,h=window.innerHeight;fxCtx.clearRect(0,0,w,h);
 for(const p of fxParticles){p.y-=p.v*dt/16;if(p.y<-8){p.y=h+5;p.x=Math.random()*w;}fxCtx.fillStyle='rgba(81,216,226,.20)';fxCtx.fillRect(p.x,p.y,p.size,p.size)}
 fxBurstParticles=fxBurstParticles.filter(p=>p.life>0);
 for(const p of fxBurstParticles){p.x+=p.vx*dt/16;p.y+=p.vy*dt/16;p.life-=dt/550;fxCtx.beginPath();fxCtx.arc(p.x,p.y,Math.max(.1,p.r*p.life),0,Math.PI*2);fxCtx.fillStyle=`rgba(174,247,123,${Math.max(0,p.life)})`;fxCtx.fill()}
 fxFrame=requestAnimationFrame(fxDraw);
}
function fxBurst(){if(!fxEnabled())return;
 for(let i=0;i<28;i++){const a=Math.random()*Math.PI*2,v=1+Math.random()*2.9;fxBurstParticles.push({x:window.innerWidth*.5,y:window.innerHeight*.36,vx:Math.cos(a)*v,vy:Math.sin(a)*v,life:1,r:2+Math.random()*3})}}

 const completeCount=entries.filter(v=>v.done).length;
 return `<section class="v34-daily"><div class="v34-daily-bar"><div><b>☑ ภารกิจทั้งหมดของวันนี้</b><small>${completeCount}/${entries.length} สำเร็จ · มื้ออาหาร ${completed.size}/4 · น้ำ ${Object.values(d.waterSlots||{}).filter(Boolean).length}/${ws.length}</small></div><span class="v34-pill">${percent(completeCount,entries.length)}%</span></div>
 <details class="v34-details"><summary>ดูรายการภารกิจและบันทึกสุขภาพ <span>⌄</span></summary><div class="v34-detail-body"><div class="v34-schedule">${entries.map(v=>`<div><time>${v.time}</time><span class="${v.done?'good':canceled[v.key]?'skipped':''}">${v.done?'✓ ':canceled[v.key]?'✕ ':'◯ '}${esc(v.name)}</span>${canceled[v.key]?`<button data-action="quest-restore" data-qkey="${esc(v.key)}">คืนเควส</button>`:''}</div>`).join('')}</div>
 <div class="v34-quick"><section><b>💧 น้ำดื่ม</b><p>${Number(d.water)||0} / ${data.profile.waterTarget} แก้ว</p><button data-action="water-minus" class="ghostbutton">−</button><button data-action="water-plus" class="ghostbutton">+ บันทึกน้ำ</button></section><section><b>☾ การนอน</b><form id="sleep-form"><label>ชั่วโมงเมื่อคืน <input type="number" name="hours" min="0" max="24" step="0.25" required value="${d.sleep??''}" placeholder="7"></label><button type="submit" class="ghostbutton">บันทึก</button></form></section><section><b>⚖ น้ำหนัก</b><form id="weight-form"><label>กิโลกรัม <input type="number" name="weight" min="25" max="300" step="0.1" required value="${d.weight??''}" placeholder="95"></label><button type="submit" class="ghostbutton">บันทึก</button></form></section></div></div></details></section>`;
}
function v34RunView(){const s=schedule(), d=day(), rec=d.runs||[], dist=totalDistance(d);return `<div class="v34-run-header"><div><small>ASCENT / TRAINING ARC · ${weekText()}</small><h2 id="v34-run-title">${gps.active?'กำลังบันทึกกิจกรรม':'ออกกำลังกายวันนี้'}</h2></div><button class="v34-close" data-run-close aria-label="ปิดหน้าต่างวิ่ง">✕</button></div><div class="v34-run-content"><div class="v34-run-plan"><b>${esc(s.label)}</b><span class="v34-goal">${s.active?fmtNum(s.targetKm,1)+' กม.':'วันพัก'}</span><p>${esc(s.desc)} · ${s.minutes} นาที · เริ่มตามตาราง ${s.exerciseTime} น.</p><p class="hint">เพซแนะนำช่วงวิ่ง ${esc(s.pace)} นาที/กม. · ช้าลงหรือเดินได้เมื่อเหนื่อย</p></div><div class="v34-gps-card"><h3>◎ LIVE GPS TRACKER</h3><div id="gps-ui">${gpsUI()}</div><p class="hint">ปิดหน้าต่างนี้แล้วการจับเวลาและ GPS ในแอปยังดำเนินต่อเมื่อหน้ายังทำงานอยู่ · ถ้าปิดจอหรือสลับแอป เบราว์เซอร์อาจหยุด GPS; การติดตามขณะล็อกจอต้องใช้ Android Foreground Service</p></div><details class="v34-run-manual" open><summary>✎ ตรวจ / บันทึกผลการวิ่ง</summary><form id="run-form" class="v34-run-form"><label>ประเภท<select name="type"><option value="walk" ${s.kind==='เดิน'?'selected':''}>เดินเร็ว</option><option value="run" ${s.kind!=='เดิน'?'selected':''}>วิ่ง / สลับเดิน</option></select></label><label>ระยะ (กม.)<input id="run-km" name="km" type="number" min="0.01" max="200" step="0.01" required placeholder="2.00"></label><label>เวลา (นาที)<input id="run-min" name="minutes" type="number" min="1" max="1440" step="0.1" required placeholder="25"></label><label>ความรู้สึก<select name="effort"><option value="easy">สบาย คุยได้</option><option value="moderate">เหนื่อยปานกลาง</option><option value="hard">หนักไป</option></select></label><button class="primary" type="submit">✓ บันทึกระยะทาง + EXP</button></form></details><div class="v34-run-foot"><p>วันนี้บันทึกแล้ว <b>${fmtNum(dist,2)} กม.</b> · ${rec.length} ครั้ง</p><button class="ghostbutton" data-run-close>ปิดหน้าต่าง (ไม่หยุด GPS)</button></div></div>`}
function v34ModalNode(){let root=document.getElementById('v34-run-modal');if(!root){root=document.createElement('div');root.id='v34-run-modal';root.className='v34-run-backdrop';root.hidden=true;root.innerHTML='<section class="v34-run-dialog" role="dialog" aria-modal="true" aria-label="บันทึกการวิ่ง"></section>';document.body.append(root)}return root}
function v34OpenRun(){v34RunModalOpen=true;const root=v34ModalNode();root.querySelector('.v34-run-dialog').innerHTML=v34RunView();root.hidden=false;document.body.classList.add('v34-modal-open');v34UpdateDock()}
function v34CloseRun(){v34RunModalOpen=false;v34ModalNode().hidden=true;document.body.classList.remove('v34-modal-open');v34UpdateDock()}
function v34UpdateDock(){let dock=document.getElementById('v34-gps-dock');if(!dock){dock=document.createElement('button');dock.id='v34-gps-dock';dock.type='button';dock.setAttribute('data-run-open','1');dock.setAttribute('aria-label','เปิดหน้าต่างวิ่งที่กำลังบันทึก');document.body.append(dock)}
 const started=gps.active||gps.elapsed>0;dock.hidden=!started||v34RunModalOpen;if(started)dock.textContent=`↗ ${gps.active?'กำลังวิ่ง':'พัก'} · ${fmtNum(gps.km,2)} กม. · ${clockGPS()}`;
}
// Existing GPS tracker remains the single source of truth, independent of modal visibility.
const v34PreviousGpsUpdate=gpsUpdate;gpsUpdate=function(){v34PreviousGpsUpdate();v34UpdateDock()};
const v34PreviousCommit=commit;commit=function(fn,msg){v34PreviousCommit(fn,msg);if(v34RunModalOpen)v34OpenRun();};
// Catch all old training-entry links before the legacy router processes them.
document.addEventListener('click',e=>{const el=e.target.closest('[data-run-open],[data-tab="run"],[data-run-close],[data-v34-food]');if(!el)return;
 if(el.matches('[data-run-open],[data-tab="run"]')){e.preventDefault();e.stopImmediatePropagation();v34OpenRun();return}
 if(el.matches('[data-run-close]')){e.preventDefault();e.stopImmediatePropagation();v34CloseRun();return}
 if(el.matches('[data-v34-food]')){e.preventDefault();e.stopImmediatePropagation();v34FoodView=el.dataset.v34Food;render();return}
},true);
document.addEventListener('click',e=>{if(e.target?.id==='v34-run-modal'){v34CloseRun()}});
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&v34RunModalOpen){v34CloseRun();e.stopImmediatePropagation()}},true);
// Make a sleep quest jump directly into the embedded home log.
document.addEventListener('click',e=>{const el=e.target.closest('[data-action="v34-open-daily"]');if(!el)return;e.preventDefault();e.stopImmediatePropagation();tab='dashboard';render();const details=document.querySelector('.v34-details');if(details){details.open=true;details.scrollIntoView({behavior:'smooth',block:'center'});setTimeout(()=>details.querySelector('input[name="hours"]')?.focus({preventScroll:true}),250)}},true);
// Old routes are folded into their parents if a legacy link is encountered.
document.addEventListener('click',e=>{const el=e.target.closest('[data-tab="pantry"],[data-tab="quests"]');if(!el)return;e.preventDefault();e.stopImmediatePropagation();if(el.dataset.tab==='pantry'){tab='food';v34FoodView='stock'}else{tab='dashboard'}render();},true);
// Restore modal form if a background save causes an app re-render.
const v34OldRender=render;render=function(){v34OldRender();v34UpdateDock()};
// Reopen the last state following visibility changes, without resetting any tracked kilometers.

render();rescheduleNative();document.addEventListener('visibilitychange',()=>{if(!document.hidden){nativeGPSReadIfPresent();lastCheck=Date.now()-60000;render();rescheduleNative()}});
if('serviceWorker' in navigator && location.protocol!=='file:')window.addEventListener('load',()=>navigator.serviceWorker.register('./sw.js').catch(()=>{}));
})();
</script></body></html>
